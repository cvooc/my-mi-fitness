name: Update body-fat data

on:
  schedule:
    # 每天北京时间 08:10（= UTC 00:10）
    - cron: "10 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-bodyfat
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
      MIHEALTH_TOKEN_B64: ${{ secrets.MIHEALTH_TOKEN_B64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Restore login credentials from secret
        run: python tools/gha_restore_token.py

      - name: Fetch body-fat records
        run: python fetch_bodyfat.py --rebuild --if-changed --show 3

      - name: Commit and push if data changed
        run: |
          git checkout -B main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bodyfat.json
          if git diff --cached --quiet; then
            echo "No data change; nothing to commit."
            exit 0
          fi
          stamp="$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          git commit -m "chore(data): update body-fat snapshot (${stamp} Asia/Shanghai)"
          git pull --rebase --autostash
          git push
